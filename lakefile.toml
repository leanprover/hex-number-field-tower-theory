name = "hex-number-field-tower-theory"
defaultTargets = ["HexNumberFieldTowerTheory"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRowReduceTheory"
git = "https://github.com/leanprover/hex-row-reduce-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexBerlekampZassenhausTheory"
git = "https://github.com/leanprover/hex-berlekamp-zassenhaus-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexResultantTheory"
git = "https://github.com/leanprover/hex-resultant-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexNumberFieldTheory"
git = "https://github.com/leanprover/hex-number-field-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexNumberFieldTower"
git = "https://github.com/leanprover/hex-number-field-tower.git"
rev = "v0.10.0"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "main"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexNumberFieldTowerTheory"
